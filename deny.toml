# cargo-deny configuration. CI runs: cargo deny check bans licenses sources advisories
# After a dependency change, run `cargo deny check licenses` and add any SPDX id it reports
# (never `Proprietary` or `LicenseRef-*`).

[graph]
all-features = true

[advisories]
yanked = "deny"
# RUSTSEC ids only, each with a comment stating why and when it will be removed.
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace members are path dependencies without a version until crates.io publishing.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
