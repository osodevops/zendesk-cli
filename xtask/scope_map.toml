# OAuth scope inference for `cargo xtask codegen`.
#
# Every operation's first tag maps to a scope *family*. GET operations get `<family>:read`,
# every other method `<family>:write`. `global` means the legacy account-wide `read` / `write`
# scopes. A family with `write = false` only has a granular read scope; its writes fall back to
# the global `write` scope. Tags that are missing here produce `scope: None` plus a codegen
# warning (the xtask test suite requires every tag of the committed specs to be mapped).
#
# Zendesk's 52 granular scopes (Admin Center > Apps and integrations > APIs > OAuth clients):
# account_settings, apps, auditlogs (read), automations, brands, custom_objects (read),
# deletion_schedules, dynamic_content, groups, hc, macros, organizations, requests,
# satisfaction_ratings, security (read), sla_policies, targets, themes, ticket_attachments,
# ticket_views, tickets, triggers, users, webhooks, zis — plus the legacy read / write / impersonate.

[families]
account_settings = { read = true, write = true }
apps = { read = true, write = true }
auditlogs = { read = true, write = false }
automations = { read = true, write = true }
brands = { read = true, write = true }
custom_objects = { read = true, write = false }
deletion_schedules = { read = true, write = true }
dynamic_content = { read = true, write = true }
groups = { read = true, write = true }
hc = { read = true, write = true }
macros = { read = true, write = true }
organizations = { read = true, write = true }
requests = { read = true, write = true }
satisfaction_ratings = { read = true, write = true }
security = { read = true, write = false }
sla_policies = { read = true, write = true }
targets = { read = true, write = true }
themes = { read = true, write = true }
ticket_attachments = { read = true, write = true }
ticket_views = { read = true, write = true }
tickets = { read = true, write = true }
triggers = { read = true, write = true }
users = { read = true, write = true }
webhooks = { read = true, write = true }
zis = { read = true, write = true }

# Operations whose tag maps to `global` but whose path sits under a resource with a granular
# family (e.g. the `Tags` and `Incremental Export` tags span tickets, users and organizations).
# Longest matching prefix wins; only consulted when the tag maps to `global`.
[path_prefixes]
"/api/v2/tickets/" = "tickets"
"/api/v2/incremental/tickets" = "tickets"
"/api/v2/incremental/ticket_events" = "tickets"
"/api/v2/users/" = "users"
"/api/v2/incremental/users" = "users"
"/api/v2/organizations/" = "organizations"
"/api/v2/incremental/organizations" = "organizations"

