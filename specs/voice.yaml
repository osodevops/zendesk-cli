      title: Voice Settings
      type: object
      properties:
        agent_confirmation_when_forwarding:
          type: boolean
          description: When true, agents must press a key to answer calls forwarded to their phones. This prevents calls from forwarding to an agent's personal voicemail if they do not take the call
        agent_wrap_up_after_calls:
          type: boolean
          description: Legacy setting, now controlled for most accounts on a per-number basis. When true, talk agents have time after each call to finish adding details to the ticket
          readOnly: true
        knowledge_suggestions_enabled:
          type: boolean
          description: When true, Knowledge Suggestions will be enabled for voice calls
        knowledge_suggestions_group_ids:
          type: array
          description: List of group IDs that will be used to enable Knowledge Suggestions for voice calls
        maximum_queue_size:
          type: integer
          description: New calls that exceed this limit are directed to voicemail. Allowed values are 0, 2, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50.
        maximum_queue_wait_time:
          type: integer
          description: Callers who wait longer than this limit are directed to voicemail. Allowed values are 1, 2, 5, 10, 15, 20, 25, 30.
        only_during_business_hours:
          type: boolean
          description: Legacy setting, now controlled for most accounts on a per-number basis. When true, calls will be routed to available agents based on the business hours defined in your Support schedule
        recordings_public:
          type: boolean
          description: When true, allows the requester to see recordings from live calls that are added to tickets
        supported_locales:
          type: array
          description: List of translation locales supported for the account
          readOnly: true
        voice:
          type: boolean
          description: When true, allows agents to make themselves available to answer calls. Your phone number can still accept voicemails when set to false
        voice_ai_collapsible_comment:
          type: boolean
          description: If true, displays collapsible call transcription and summary comments instead of internal note on a voice ticket
        voice_ai_display_transcript:
          type: boolean
          description: If true, displays call transcription relating to a call recording on a voice ticket (if turned on for a given line)
        voice_ai_enabled:
          type: boolean
          description: If true, displays call transcription relating to a call recording on tickets (if turned on for a given line)
        voice_ai_enabled_lines:
          type: array
          description: List of phone number ids that have voice AI enabled
        voice_transcriptions_boosted_keywords:
