  /api/v2/channels/voice/dashboard/account_level_activity:
    get:
      operationId: GetAccountLevelActivity
      tags:
        - Dashboard
      summary: Get Account-level Activity
      description: |-
        Returns real-time activity metrics aggregated across the entire account, or
        across a filtered set of phone numbers.

        #### Allowed For
        - Agents
        - Support users with Voice Dashboard Access permission
      parameters:
        - name: phone_numbers
          in: query
          description: Optional list of phone number IDs to filter aggregation by
          schema:
            type: array
            items:
              type: integer
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardActivityAggregationResponse'
              examples:
                default:
                  $ref: '#/components/examples/DashboardActivityAggregationResponse'
        "404":
          description: One or more phone numbers in `phone_numbers` do not belong to the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  $ref: '#/components/examples/ErrorResponse'
        "504":
          description: The stats backend timed out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                default:
                  value:
                    message: ElasticSearch is down
  /api/v2/channels/voice/dashboard/agent_level_activity:
    get:
      operationId: GetAgentLevelActivity
      tags:
        - Dashboard
      summary: Get Agent-level Activity
      description: |-
        Returns real-time activity metrics per agent, optionally scoped to a set of
        groups. When the account has voice dashboard pagination enabled, the response
        includes pagination metadata.

        #### Allowed For
        - Agents
        - Support users with Voice Dashboard Access permission
      parameters:
        - name: groups
          in: query
          description: Group IDs to scope the agent list by
          schema:
            type: array
            items:
              type: integer
        - name: page
          in: query
          description: Page number for paginated responses
          schema:
            type: integer
        - name: per_page
          in: query
          description: Records per page for paginated responses
          schema:
            type: integer
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAgentLevelActivityResponse'
              examples:
                default:
                  $ref: '#/components/examples/DashboardAgentLevelActivityResponse'
        "504":
          description: The stats backend timed out. Returns a partial response with an empty agents list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAgentLevelActivityResponse'
              examples:
                default:
                  value:
                    agents_activity:
                      agents: []
