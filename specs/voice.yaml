              example: 'Call from: Zenguins'
            to_line:
              type: string
              example: "+10987654321"
            transcript:
              type: string
              example: Hey, just wanted to let the team know, TPE is great!
        formatted_from:
          type: string
          description: The formatted representation of the from_line
          example: +1 (123) 456-7890
        formatted_to:
          type: string
          description: The formatted representation of the to_line
          example: +1 (098) 765-4321
        html_body:
          type: string
          description: The html representation of the body of the comment
          example: 'Call with Zenguins<br>Call Details:<br><br>Call from: +1 (23) 456-7890<br>Call to: +1 (098) 765-4321<br>Time of call: 2022-11-04T12:00:00Z<br>Length of phone call: <br>'
        id:
          type: integer
          description: The ID of the comment audit event
          example: 7040574985853
        public:
          type: boolean
          description: Is the comment public or private
          example: true
        title:
          type: string
          description: The title of the comment
          example: 'Call from: Zenguins'
        transcription_visible:
          type: boolean
          description: Is the transcription visible or not
          example: true
        trusted:
          type: boolean
          description: Is the comment from a trusted source
          example: true
        type:
          type: string
          description: The type of comment created
          example: TpeVoiceComment
