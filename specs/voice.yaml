  /api/v2/channels/voice/phone_numbers/{phone_number_id}:
    get:
      operationId: ShowPhoneNumber
      tags:
        - Phone numbers
      summary: Show Phone Number
      description: |
        Retrieves a phone number.

        #### Including additional information

        Use the `include` query parameter to retrieve additional information about a phone number. The parameter accepts the following values:

        - all_greetings
        - all_groups
        - all_schedules
        - ivrs
        - settings

        For example, to retrieve a phone number's settings, use `?include=settings`.  The response includes a `settings` child object in the `phone_number` object. For returned `settings` properties, see [Settings JSON Format](#settings-json-format).

        Use commas to separate multiple values. Example:`?include=settings,ivrs,all_groups`.

        #### Allowed For
        - Agents
      parameters:
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/PhoneNumberID'
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberSettingsResponse'
              examples:
                default:
                  $ref: '#/components/examples/PhoneNumberResponse'
    put:
      operationId: UpdatePhoneNumber
      tags:
        - Phone numbers
      summary: Update Phone Number
      description: |-
        Updates an existing phone number.

        #### Including additional information

        Use the `include` query parameter to update additional information about a phone number. The parameter accepts the following values:

        - all_greetings
        - all_groups
        - all_schedules
        - ivrs
        - settings

        For example, to update a phone number's settings, use `?include=settings` and include a `settings` child object in the request body's `phone_number` object. For supported `settings` properties, see [Settings JSON Format](#settings-json-format).

        Use commas to separate multiple values. Example:`?include=settings,ivrs,all_groups`.

        #### Settings JSON Format

        | Name | Type | Read-only | Mandatory | Description |
        | ---- | ---- | --------- | --------- | ----------- |
        | allow_outbound_calls | boolean | false | false | Whether outbound calls are allowed on this phone number |
        | all_groups_access_enabled | boolean | false | false | If true, all groups can place outbound calls from this phone number and `outbound_calls_group_ids` is not enforced |
        | auto_accept_enabled | boolean | false | false | If true, incoming calls to this phone number are automatically accepted after `auto_accept_time` seconds. Only present when the auto-accept feature is enabled for the account |
        | auto_accept_time | integer | false | false | Number of seconds to wait before automatically accepting an offered call when `auto_accept_enabled` is true. Allowed values are 0, 5, or 10; 0 accepts the call immediately. Only present when the auto-accept feature is enabled for the account |
        | average_wait_time_message_enabled | boolean | false | false | Whether average wait time message is enabled on this phone number |
        | call_offering_duration | integer | false | false | How long the call is offered to an agent for this phone number (in seconds) |
        | call_recording_delete_after | string | false | false | Length of time before call recordings are deleted. Allowed values are 'never', '1.days', '1.weeks', '2.weeks', '1.months', '2.months', '3.months', '6.months', '1.years', and '2.years' |
        | callback_from_queue | boolean | false | false | Whether callback from queue is enabled on this phone number |
        | callback_locale | string | false | false | ISO 639-1 language code for the callback phone number confirmation greeting |
        | create_ticket_for_abandoned_calls | boolean | false | false | If true, calls abandoned on this phone number create a ticket |
        | dequeue_retry_if_attempted | boolean | false | false | If true, the call is dequeued after a retry attempt |
        | forwarding_caller_id | string | false | false | Sets the caller ID shown on calls forwarded by IVR or overflow. The default value is "caller_number". Other values are "talk_number" and "talk_number_for_anonymous" |
        | maximum_queue_size | integer | false | false | Maximum number of phone calls allowed in the queue before being directed to voicemail |
        | maximum_queue_wait_time | integer | false | false | Maximum wait time that a phone call can be allocated to the queue (in minutes) |
        | outbound_calls_group_ids | array | false | false | IDs of the groups allowed to place outbound calls from this phone number. Enforced only when `all_groups_access_enabled` is false |
        | overflow_number | object | false | false | Defines an overflow number used when a call cannot currently be taken by any agents or answered by voicemail. For an example of this object, see [Overflow number example](#overflow-number-example)  |
        | priority | integer | false | false | Priority of this phone number |
        | voicemail | boolean | false | false | If true, voicemail is enabled for this phone number |
        | voicemail_outside_business_hours | boolean | false | false | If true, callers can leave voicemails outside of business hours |
        | voicemail_recording_delete_after | string | false | false | Length of time before voicemail recordings are deleted. Allowed values are 'never', '1.days', '1.weeks', '2.weeks', '1.months', '2.months', '3.months', '6.months', '1.years', '2.years' |
        | wrap_up_enabled | boolean | false | false | If true, Talk agents have time after each call to finish adding details to the ticket |
        | wrap_up_time_limit | integer | false | false | Amount of time agents have to wrap up calls for each number (in seconds) |

        ##### Overflow number example
        ```json
        "overflow_number": {
                "enabled": true,
                "number": "+12518717081"
        }
        ```

        #### Allowed For
        - Agents
      parameters:
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/PhoneNumberID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberUpdateRequest'
            examples:
              default:
                $ref: '#/components/examples/PhoneNumberUpdateRequest'
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberSettingsResponse'
              examples:
                default:
                  $ref: '#/components/examples/PhoneNumberResponse'
    delete:
      operationId: DeletePhoneNumber
      tags:
        - Phone numbers
      summary: Delete Phone Number
      description: |-
        #### Allowed For
        - Agents
      parameters:
        - $ref: '#/components/parameters/PhoneNumberID'
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: string
                description: empty
                example: ""
              example: ""
