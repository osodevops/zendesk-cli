components:
  schemas:
    AccountOverviewBaseObject:
      type: object
      properties:
        average_call_duration:
          type: integer
          description: Average time of call across all calls
        average_queue_wait_time:
          type: integer
          description: Average time caller spent in queue waiting to be routed to an agent
        average_wrap_up_time:
          type: integer
          description: Average wrap-up time across all calls
        max_calls_waiting:
          type: integer
          description: Maximum number of calls waiting for an agent in the queue, including caller on the line and callback requests
        max_queue_wait_time:
          type: integer
          description: Maximum time caller spent in queue waiting to be routed to an agent
        total_call_duration:
          type: integer
          description: Total duration of all calls
        total_calls:
          type: integer
          description: Total number of inbound and outbound calls
        total_voicemails:
          type: integer
          description: Total number of calls that went to voicemail for any reason
        total_wrap_up_time:
          type: integer
          description: Total wrap-up time across all calls
    AccountOverviewExtendedObject:
      title: Stats
      type: object
      allOf:
        - $ref: '#/components/schemas/AccountOverviewBaseObject'
        - type: object
          properties:
            average_callback_wait_time:
              type: integer
              description: Average callback time a customer has been waiting for an agent in the queue. Excludes Available agents greeting
            average_hold_time:
              type: integer
              description: Average time caller spent on hold per call
            average_time_to_answer:
              type: integer
              description: Average time between system answering a call and customer being connected with an agent. Includes greetings and other recordings played
            total_callback_calls:
              type: integer
              description: Total number of callback requests (successful or not)
            total_calls_abandoned_in_queue:
              type: integer
              description: Total number of calls where customer hung up while waiting in the queue
            total_calls_outside_business_hours:
              type: integer
              description: Total number of calls received outside business hours
            total_calls_with_exceeded_queue_wait_time:
              type: integer
              description: Total number of calls sent to voicemail after exceeding the max wait time in the queue
            total_calls_with_requested_voicemail:
              type: integer
              description: Total number of calls where customer requested to be put through to voicemail by dialing 1
            total_embeddable_callback_calls:
              type: integer
              description: Total number of callback calls requested via Web Widget (successful or not)
            total_hold_time:
              type: integer
              description: Total hold time across all calls
            total_inbound_calls:
              type: integer
              description: Total number of inbound calls
            total_outbound_calls:
              type: integer
              description: Total number of outbound calls
            total_textback_requests:
              type: integer
              description: Total number of textback messages sent from IVR
    AccountOverviewResponse:
      type: object
      properties:
        account_overview:
          $ref: '#/components/schemas/AccountOverviewExtendedObject'
    AddressCreateRequest:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/AddressInput'
    AddressInput:
      type: object
      properties:
        city:
          type: string
          description: The city of the address
        country_code:
          type: string
          description: The ISO code of the country for this address
        name:
          type: string
          description: The name of the address
        province:
          type: string
          description: The province of the address
        state:
          type: string
          description: The state of the address
          nullable: true
        street:
          type: string
          description: The street of the address
        zip:
          type: string
          description: The zip of the address
      required:
        - name
        - street
        - zip
