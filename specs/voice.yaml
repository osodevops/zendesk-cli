    PhoneNumberSettingsObject:
      title: Phone number settings
      type: object
      properties:
        all_groups_access_enabled:
          type: boolean
          description: If true, all groups can place outbound calls from this phone number and `outbound_calls_group_ids` is not enforced
        allow_outbound_calls:
          type: boolean
          description: Whether outbound calls are allowed on this phone number
        auto_accept_enabled:
          type: boolean
          description: If true, incoming calls on this phone number are automatically accepted after `auto_accept_time` seconds. Only present when the auto-accept feature is enabled for the account.
        auto_accept_time:
          type: integer
          description: Number of seconds to wait before automatically accepting an offered call when `auto_accept_enabled` is true. Allowed values are 0, 5, or 10; 0 accepts the call immediately. Only present when the auto-accept feature is enabled for the account.
          enum:
            - 0
            - 5
            - 10
        average_wait_time_message_enabled:
          type: boolean
          description: Whether average wait time message is enabled on this phone number
        call_offering_duration:
          type: integer
          description: How long the call is offered to an agent for this phone number (in seconds). Ignored when auto-accept is enabled (`auto_accept_enabled`), because the call is accepted automatically before the offering duration elapses.
        call_recording_delete_after:
          type: string
          description: Length of time before call recordings are deleted. Allowed values are 'never', '1.days', '1.weeks', '2.weeks', '1.months', '2.months', '3.months', '6.months', '1.years', '2.years'
          enum:
            - never
            - 1.days
            - 1.weeks
            - 2.weeks
            - 1.months
            - 2.months
            - 3.months
            - 6.months
            - 1.years
            - 2.years
        callback_from_queue:
          type: boolean
          description: Whether callback from queue is enabled on this phone number
        callback_locale:
          type: string
          description: ISO 639-1 language code for the callback phone number confirmation greeting
        create_ticket_for_abandoned_calls:
          type: boolean
          description: If true, calls abandoned on this phone number create a ticket
        dequeue_retry_if_attempted:
          type: boolean
          description: If true, the call is dequeued after a retry attempt
        forwarding_caller_id:
          type: string
          description: Controls which caller ID appears when forwarding calls via IVR or overflow. Does not affect agent forwarding or transfers to external numbers. Only available for PSTN phone numbers.
          enum:
            - caller_number
            - talk_number
            - talk_number_for_anonymous
          default: caller_number
        maximum_queue_size:
          type: integer
          description: Maximum number of phone calls allowed in the queue before being directed to voicemail
        maximum_queue_wait_time:
          type: integer
          description: Maximum wait time that a phone call can be allocated to the queue (in minutes)
        outbound_calls_group_ids:
          type: array
          description: IDs of the groups allowed to place outbound calls from this phone number. Enforced only when `all_groups_access_enabled` is false.
          items:
            type: integer
        overflow_number:
          type: object
          description: Defines an overflow number used when a call cannot currently be taken by any agents or answered by voicemail.
          properties:
            enabled:
              type: boolean
              description: Whether the overflow number is enabled
            number:
              type: string
              description: The overflow number
        priority:
          type: integer
          description: Priority of this phone number
        voicemail:
          type: boolean
          description: If true, voicemail is enabled for this phone number
        voicemail_outside_business_hours:
          type: boolean
          description: If true, callers can leave voicemails outside of buisness hours
        voicemail_recording_delete_after:
          type: string
          description: Length of time before voicemail recordings are deleted. Allowed values are 'never', '1.days', '1.weeks', '2.weeks', '1.months', '2.months', '3.months', '6.months', '1.years', '2.years'
          enum:
            - never
            - 1.days
            - 1.weeks
            - 2.weeks
            - 1.months
            - 2.months
            - 3.months
            - 6.months
            - 1.years
            - 2.years
        wrap_up_enabled:
          type: boolean
          description: If true, Talk agents have time after each call to finish adding details to the ticket
        wrap_up_time_limit:
          type: integer
          description: Amount of time agents have to wrap up calls for each number (in seconds)
          nullable: true
