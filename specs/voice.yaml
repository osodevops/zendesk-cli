    put:
      operationId: UpdateGreetings
      tags:
        - Greetings
      summary: Update Greeting
      description: |-
        Updates the greeting object or the recording of the greeting file. See the **Using curl** sections below for more information.

        #### Allowed For
        - Agents

        #### Content Types

        In addition to application/json, this endpoint supports multipart/form-data to upload local mp3 or wav files. If using multipart/form-data, the name of the input form field is `greeting[upload_attributes][uploaded_data]`. The following example uses the `-F` form option in cURL:

        ```
        -F 'greeting[upload_attributes][uploaded_data]=@/path/to/file.mp3'
        ```
      parameters:
        - $ref: '#/components/parameters/GreetingsID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GreetingsUpdateRequest'
            examples:
              default:
                $ref: '#/components/examples/GreetingsUpdateRequest'
          audio/mpeg: {}
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GreetingResponse'
              examples:
                default:
                  $ref: '#/components/examples/GreetingResponse'
    delete:
      operationId: DeleteGreeting
      tags:
        - Greetings
      summary: Delete Greeting
      description: |-
        #### Allowed For
        - Agents
      parameters:
        - $ref: '#/components/parameters/GreetingsID'
      responses:
