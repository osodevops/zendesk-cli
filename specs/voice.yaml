    TpeCallObject:
      title: Calls
      type: object
      allOf:
        - type: object
          properties:
            agent_id:
              type: integer
              description: Zendesk id of the agent who answered the call. Zendesk displays this information in the ticket as the name of the agent in the system
            app_id:
              type: integer
              description: The app's unique identifier
              readOnly: true
            brand_id:
              type: integer
              description: Zendesk id of the brand associated with the call. In case a new ticket is created, this is the brand the ticket will be created under.
            call_disposition:
              type: string
              description: Outcome of the call, such as 'no longer in business', 'do not call again', 'problem solved', 'escalated' and so forth
            call_ended_at:
              type: string
              description: Date and time when the call ended (for example, the agent ends the phone call) in ISO 8601 format
            call_recording_consent:
              type: string
              description: Call recording consent value configured by the account for the phone number. Allowed values are 'always', 'opt_in', 'opt_out' or 'never'
            call_recording_consent_action:
              type: string
              description: Call recording consent option selected by the caller. For example, 'caller_opted_in', 'caller_opted_out'
            call_started_at:
              type: string
              description: Date and time the call is connected (when the greeting starts playing) in ISO 8601 format
            call_type:
              type: string
              description: The type of the call, regarding its origin, for example,  "phone" or "digital"
            callback_number:
              type: string
              description: The number entered in the IVR by the user when requesting a callback. Usually, an alternative phone number for the caller
            callback_source:
              type: string
              description: The source of the callback request. Allowed values are 'queue' or 'web widget'
            completion_status:
              type: string
              description: Status of the call. It should be empty for calls in progress. Allowed values are 'completed', 'abandoned_in_queue', 'abandoned_in_ivr', 'abandoned_in_voicemail', 'abandoned_on_hold', 'pending_voicemail', 'missed', 'declined', 'dropped', 'dropped_by_caller' or 'dropped_by_agent'
            consultation_time:
              type: integer
              description: Sum of how long in seconds agents consulted with each other while the customer was on hold
            created_at:
              type: string
              description: System generated time when the call object was created in ISO 8601 format
            customer_requested_voicemail:
              type: boolean
              description: The customer requested to be directed to voicemail instead of waiting for an agent to answer
            direction:
              type: string
              description: Call direction. Allowed values are 'inbound', 'outbound', 'internal' or 'callback'
            dnis:
              type: string
              description: Number dialed by the caller
            duration:
              type: integer
              description: Call duration in seconds
            end_user_id:
              type: integer
              description: Zendesk id of the caller (end user)
            end_user_location:
              type: string
              description: An approximation of the geographic area for the phone number, usually based on the prefix of the number or IP of the caller
            exceeded_queue_time:
              type: boolean
              description: If true, the caller exceeded the maximum queue wait time and did not speak with an agent
            external_id:
              type: string
              description: An id representing the call in an external system
            from_line:
              type: string
              description: The phone number of the person who initated the call
            from_line_nickname:
              type: string
              description: For outbound calls, the nickname of the line that made the call. For inbound calls it should be empty or null
            hold_time:
              type: integer
              description: How long in seconds the customer was on hold
            id:
              type: integer
              description: Automatically assigned upon creation
              readOnly: true
            ivr_action:
              type: string
              description: Menu action used by the caller in the IVR menu selection. Possible values are null (if IVR was not used), "menu", "voicemail", "group", "phone_number", "textback", "invalid", and so forth
            ivr_destination_group_name:
              type: string
              description: Name of the group that received the call through IVR routing. Partners that don't use groups the same way as Zendesk can use this field as the last option selected by the caller in the IVR menu
            ivr_hops:
              type: integer
              description: How many menu options the customer went through in IVR before talking to an agent
            ivr_routed_to:
              type: string
              description: Phone number where the call was routed to by IVR. null if IVR was disabled
            ivr_time_spent:
              type: integer
              description: How long in seconds the customer spent in IVR before entering the queue
            not_recording_time:
              type: integer
              description: How long in seconds spend not recording on the call
            organization_id:
              type: integer
              description: Zendesk id of the organization associated with the call. In case a new ticket is created, this is the organization the ticket will be created under.
            outside_business_hours:
              type: boolean
              description: If true, the call was received outside business hours
            overflowed:
              type: boolean
              description: if true, the call overflowed to a different number
            overflowed_to:
              type: string
              description: The number that the call overflowed to, null if overflowed is false
            phone_name:
              type: string
              description: Unique caller id name registered in a CNAM database. Used by VoIP services. For landline providers, this is the same as the phone number
            queue_name:
              type: string
              description: The name of the queue from where the caller came
            queue_time:
              type: integer
              description: How long in seconds of how long the customer spent in queue before the agent picks up the call
            recording_control_interactions:
              type: integer
              description: The number of times agents have paused or resumed a recording on the call
            recording_time:
              type: integer
              description: How long in seconds spent recording on the call
            recording_url:
              type: string
              description: URL of the recording. This is displayed in the voice comment both as an audio player (if the audio is reachable) and the actual URL
            talk_time:
              type: integer
              description: Duration of the call in seconds the customer was in conference with an agent(s). Hold time and conference time are not included in the talk time
            ticket_id:
              type: integer
              description: Zendesk id of the ticket associated with the call
            time_to_answer:
              type: integer
              description: How long in seconds the customer waited for the agent after greeting
            to_line:
              type: string
              description: Phone number of the person who received the call
            to_line_nickname:
              type: string
              description: For inbound calls, the nickname of the line that received the call. For outbound calls, it should be empty or null
            transcript:
              type: string
              description: Transcript of the message in plain text. Line breaks ('\n') are allowed
            updated_at:
              type: string
              description: System generated time when the call was last updated in ISO 8601 format
            voicemail:
              type: boolean
              description: If true, a voicemail was created
            wait_time:
              type: integer
              description: How long in seconds the customer waited for the agent after hearing the greeting
            wrap_up_time:
              type: integer
              description: Sum of how long in seconds the agent(s) spent in wrap up
          required:
            - from_line
            - to_line
            - call_started_at
            - direction
            - app_id
      example:
        agent_id: 88902883
        app_id: 735264019863524
        brand_id: 9157783614
        call_disposition: Call again later
        call_ended_at: "2022-01-27T15:31:40-04:00"
        call_recording_consent: opt_in
        call_recording_consent_action: caller_opted_out
        call_started_at: 2022-01-27T15:31:40+01
        call_type: PSTN
        callback_number: +1 (661) 748-0123
        callback_source: queue
        completion_status: completed
        consultation_time: 67
        customer_requested_voicemail: false
        direction: inbound
        dnis: 0800-12345
        duration: 345
        end_user_id: 7827
        end_user_location: Dublin
        exceeded_queue_time: true
        external_id: 1245HN567
        from_line: "+183808333456"
        from_line_nickname: Sales
        hold_time: 120
        id: 1
        ivr_action: voicemail
        ivr_destination_group_name: Billing
        ivr_hops: 3
        ivr_routed_to: "+1311123456789"
        ivr_time_spent: 21
        not_recording_time: 210
        outside_business_hours: false
        overflowed: false
        overflowed_to: +1 (661) 748-0123
        phone_name: 1300 SELL
        queue_name: priority_one
        queue_time: 36
        recording_control_interactions: 3
        recording_time: 210
        recording_url: https://somedomain.com/recording/123.mp3
        talk_time: 360
        ticket_id: 37987922
        time_to_answer: 24
        to_line: "+149488484873"
        to_line_nickname: Technical Support
        transcript: There is an issue with my printer. Can you help? ...
        voicemail: false
        wait_time: 20
        wrap_up_time: 210
