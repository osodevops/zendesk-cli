openapi: 3.0.2
info:
  title: Talk API
  description: Standalone voice application APIs that supports the Zendesk Voice product, including call management via Twilio, Voice API endpoints and the Voice admin pages.
  contact:
    name: Zendesk
  version: "2022-04-04"
tags:
  - name: Addresses
  - name: Availabilities
    description: Represents the availability state of an agent and call status.
  - name: Callback Requests
  - name: Greetings
  - name: Incremental Exports
  - name: IVRs
  - name: IVR Menus
  - name: IVR Routes
  - name: Phone numbers
  - name: Digital lines
  - name: Lines
  - name: Voice Settings
  - name: Recordings
    description: Recordings are stored by Talk and exposed in the corresponding ticket in a voice comment.
  - name: Stats
  - name: Blocked Phone Numbers
    description: Phone numbers that are blocked from calling into the account.
  - name: Call Console
    description: Endpoints supporting the Voice call console (client tokens, emergency numbers).
  - name: Dashboard
    description: Real-time voice activity metrics aggregated at account, queue, and agent level.
  - name: Talk Embeddables
    description: Web and SDK Talk widget configurations.
  - name: Transcriptions
    description: Voice AI call transcriptions.
  - name: Calls
paths:
  /api/v2/calls:
    post:
      operationId: CreateCall
      tags:
        - Calls
      summary: Create a Call Object
      description: "Creates a standard call object record.\n\nOptionally, creates a ticket and comment by also passing a VoiceComment object.  See [Valid comment fields](#valid-comment-fields).\n\nWhen creating a ticket with a comment, the `subject` field sets the ticket's subject. If `subject` is not provided, `title` is used. \n\n**Note**: \n\n- This field does not update the ticket's subject if a ticket already exists.\n- Do not include `ticket_id` in the call object. Including `ticket_id`, even if it is null, results in an error.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TpeCallObjectCreateRequest'
            examples:
              default:
                $ref: '#/components/examples/TpeCallObjectCreateRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  call:
                    allOf:
                      - $ref: '#/components/schemas/ID'
                      - $ref: '#/components/schemas/TpeCallObjectCreateResponse'
              examples:
                default:
                  $ref: '#/components/examples/TpeCallObjectResponse'
  /api/v2/calls/{call_id}:
    get:
      operationId: GetCall
      tags:
        - Calls
      summary: Retrieve a Single Call by id
      description: |
        Returns a call object according to the unique id provided.
      parameters:
        - $ref: '#/components/parameters/CallID'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  call:
                    allOf:
                      - $ref: '#/components/schemas/TpeCallObjectCreateResponse'
              examples:
                default:
                  $ref: '#/components/examples/TpeCallObjectResponse'
    patch:
      operationId: UpdateCall
      tags:
        - Calls
      summary: Update a Call
      description: Updates a voice comment on the ticket linked to the call object.
      parameters:
        - $ref: '#/components/parameters/CallID'
      requestBody:
        description: call to be updated
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TpeCallObjectUpdateRequest'
            examples:
              default:
                $ref: '#/components/examples/TpeCallObjectPatchRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  call:
                    allOf:
                      - $ref: '#/components/schemas/TpeCallObjectCreateResponse'
              examples:
                default:
                  $ref: '#/components/examples/TpeCallObjectResponse'
  /api/v2/calls/{call_id}/comments:
    post:
      operationId: CreateComment
      tags:
        - Calls
      summary: Creates a Voice Comment on a Ticket
      description: |
        `title` is required.

        `call_fields` displays selected fields based on your preferences. If `call_fields` is not provided, only the required fields are displayed. For a list of valid comment fields, see [Valid comment fields](#valid-comment-fields).

        `author_id` is the author of the comment. If no `author_id` is provided, then `end_user_id` is used. If `end_user_id` is not set, it defaults to the integration user that called the API.

        `display_to_agent` screen pops the ticket to the agent's browser when the voice comment is added. Leaving this field blank adds the comment, but the ticket must be manually opened. The agent id is validated before the call or ticket is created. A "422 - Unprocessable entity" error is returned if the agent id is invalid.
      parameters:
        - $ref: '#/components/parameters/CallID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TpeVoiceCommentCreateRequest'
            examples:
              default:
                $ref: '#/components/examples/TpeVoiceCommentCreateRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TpeVoiceComment'
              examples:
                default:
                  $ref: '#/components/examples/TpeVoiceCommentResponse'
