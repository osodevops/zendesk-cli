    IncrementalCallLegsExportObject:
      title: Incremental Exports
      type: object
      properties:
        agent_id:
          type: integer
          description: Id of the agent associated with this part of the call. When agent_id is positive, then user_id must be 0 and the type is “agent_leg”
        available_via:
          type: string
          description: Ways the agent is available for incoming calls.
          enum:
            - null
            - browser
            - phone
          nullable: true
        call_charge:
          type: string
          description: |-
            Call charge on the leg. String representation of a decimal number with six
            decimal places. Example: "1.230000"
        call_id:
          type: integer
          description: Call id that the leg belongs to
        completion_status:
          type: string
          description: Completion status of the leg.
          enum:
            - agent_declined
            - agent_missed
            - agent_unreachable
            - agent_transfer_declined
            - customer_hang_up
            - completed
        conference_from:
          type: integer
          description: id of agent who initiated the third-party conference
          nullable: true
        conference_time:
          type: integer
          description: |-
            Time that agent spent in third-party conference (if call has multiple
            conferences we will sum the conference time)
          nullable: true
        conference_to:
          type: integer
          description: id of user or agent that joined the third-party conference
          nullable: true
        consultation_from:
          type: integer
          description: |-
            The id of the agent who initialized a consultation. This value must be 0
            on the first agent's leg. null if there was no consultation
          nullable: true
        consultation_time:
          type: integer
          description: |-
            How long the agent consulted with another agent while the customer was on
            hold. null if there was no consultation
          nullable: true
        consultation_to:
          type: integer
          description: |-
            The id of the agent who received and accepted the consultation request.
            null if there was no transfer
          nullable: true
        created_at:
          type: string
          format: date-time
          description: When the leg object was created
        duration:
          type: integer
          description: How long in seconds the leg existed
        forwarded_to:
          type: string
          description: 'Phone number the call was forwarded to. Example: "+1311123456789". It can be null on customer leg'
          nullable: true
        hold_time:
          type: integer
          description: How long in seconds the leg was on hold
        id:
          type: integer
          description: Leg id
        minutes_billed:
          type: integer
          description: Minutes billed
          nullable: true
        quality_issues:
          type: array
          description: |-
            A summary of the leg's quality issues related to the call provided to
            Zendesk from Twilio. Until the information is made available by Twilio,
            the array contains "information_not_available". If there are no issues,
            the array contains "none".
          items:
            type: string
            enum:
              - information_not_available
              - none
              - silence
              - high_jitter
              - high_packet_loss
              - high_pdd
              - high_latency
        talk_time:
          type: integer
          description: How long in seconds the agent was in conference with the customer for this leg
        transferred_from:
          type: integer
          description: |-
            The id of the agent who initialized the transfer. This value must be 0 on
            the first agent's leg. null if there was no transfer
          nullable: true
        transferred_to:
          type: integer
          description: The id of the agent who received and accepted the transfer request
          nullable: true
        type:
          type: string
          description: The type of the leg.
          enum:
            - customer
            - agent
            - external
            - supervisor
        updated_at:
          type: string
          format: date-time
          description: When the leg object was last updated
        user_id:
          type: integer
          description: Id of the customer or user associated with this part of the call. When user_id is positive then agent_id must be 0 and the type is “customer_leg”
          nullable: true
        wrap_up_time:
          type: integer
          description: How long in seconds the leg was in wrap up. It can be null on customer leg
          nullable: true
    IncrementalCallLegsExportResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/IncrementalExportsObject'
        - type: object
          properties:
            legs:
              type: array
              items:
                $ref: '#/components/schemas/IncrementalCallLegsExportObject'
